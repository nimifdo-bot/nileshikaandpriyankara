<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>RSVP form registration</title></head>
  <body>
    <form name="rsvp" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="rsvp" />
      <input name="invited-as" />
      <input name="attendance" />
      <input name="guests" />
      <input name="name" />
      <input name="phone" type="tel" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
